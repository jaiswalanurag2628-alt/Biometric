<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Biometric Attendance Matrix Generator</title>

<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx-js-style@1.2.0/dist/xlsx.bundle.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>

<style>
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    .status { display: none; }
</style>
</head>

<body class="bg-slate-100 min-h-screen p-6">
<div class="max-w-4xl mx-auto bg-white p-8 rounded-2xl shadow-xl border border-slate-200">

    <div class="flex items-center gap-3 mb-6">
        <div class="bg-blue-600 text-white p-3 rounded-xl text-xl">📊</div>
        <div>
            <h1 class="text-2xl font-bold text-slate-900">
                Biometric Attendance Matrix Generator
            </h1>
            <p class="text-sm text-slate-500">
                Reads employee attendance from all Excel sheets and logs the Sheet Name in Column 2.
            </p>
        </div>
    </div>

    <div class="mb-5">
        <label class="block text-sm font-semibold text-slate-700 mb-2">
            Upload Attendance Source File (.xlsx, .xls, .xml)
        </label>
        <input
            type="file"
            id="fileInput"
            accept=".xlsx,.xls,.xml"
            class="block w-full text-sm text-slate-500
            file:mr-4 file:py-2.5 file:px-4 file:rounded-lg file:border-0
            file:text-sm file:font-semibold file:bg-blue-600 file:text-white
            hover:file:bg-blue-700 cursor-pointer">
    </div>

    <div id="status"
         class="status mb-5 p-4 rounded-xl bg-slate-100 text-sm font-medium text-slate-700">
    </div>

    <div class="flex gap-4">
        <button type="button"
                id="excelBtn"
                class="w-1/2 bg-slate-800 text-white font-semibold py-3 px-4
                rounded-xl hover:bg-slate-900 transition shadow-sm">
            📥 Download Excel Report
        </button>

        <button type="button"
                id="pdfBtn"
                class="w-1/2 bg-blue-600 text-white font-semibold py-3 px-4
                rounded-xl hover:bg-blue-700 transition shadow-sm">
            📄 Download PDF Report
        </button>
    </div>
</div>

<script>
"use strict";

(function () {

    const statusBox = document.getElementById("status");
    const fileInput = document.getElementById("fileInput");

    function showStatus(message, type) {
        statusBox.style.display = "block";
        statusBox.textContent = message;

        if (type === "error") {
            statusBox.className =
                "mb-5 p-4 rounded-xl bg-red-50 text-red-700 border border-red-200 text-sm font-medium";
        } else if (type === "success") {
            statusBox.className =
                "mb-5 p-4 rounded-xl bg-green-50 text-green-700 border border-green-200 text-sm font-medium";
        } else {
            statusBox.className =
                "mb-5 p-4 rounded-xl bg-blue-50 text-blue-700 border border-blue-200 text-sm font-medium";
        }
    }

    function clean(value) {
        if (value === null || value === undefined) return "";
        return String(value).trim();
    }

    function normalizeName(value) {
        return clean(value).replace(/\s+/g, " ");
    }

    function isDay(value) {
        const s = clean(value);
        return /^(0?[1-9]|[12][0-9]|3[01])$/.test(s);
    }

    function dayNumber(value) {
        return parseInt(clean(value), 10);
    }

    function timeToMinutes(value) {
        let s = clean(value).toUpperCase();
        if (!s || s === "--" || s === "-") return null;

        s = s.replace(/\./g, ":");
        const ampm = s.match(/\b(AM|PM)\b/);
        const match = s.match(/(\d{1,2}):(\d{1,2})/);

        if (!match) return null;

        let h = parseInt(match[1], 10);
        const m = parseInt(match[2], 10);

        if (Number.isNaN(h) || Number.isNaN(m)) return null;

        if (ampm) {
            if (ampm[1] === "PM" && h < 12) h += 12;
            if (ampm[1] === "AM" && h === 12) h = 0;
        }

        if (h > 23 || m > 59) return null;
        return h * 60 + m;
    }

    function calculateWorkingHours(inStr, outStr) {
        const inMinutes = timeToMinutes(inStr);
        const outMinutes = timeToMinutes(outStr);

        if (inMinutes === null || outMinutes === null) {
            return "00:00";
        }

        let difference = outMinutes - inMinutes;
        if (difference < 0) {
            difference += 24 * 60;
        }

        const hours = Math.floor(difference / 60);
        const minutes = difference % 60;

        return String(hours).padStart(2, "0") + ":" +
               String(minutes).padStart(2, "0");
    }

    function parsePunch(value) {
        const raw = clean(value);

        if (!raw || raw === "-" || raw === "--") {
            return { in: "--", out: "--", hrs: "00:00" };
        }

        let parts = raw.split(/\s*[-–—]\s*/);
        if (parts.length < 2) {
            return { in: raw, out: "--", hrs: "00:00" };
        }

        const inTime = clean(parts[0]) || "--";
        const outTime = clean(parts.slice(1).join("-")) || "--";

        return {
            in: inTime,
            out: outTime,
            hrs: calculateWorkingHours(inTime, outTime)
        };
    }

    function isBlockedHeader(value) {
        const v = normalizeName(value).toLowerCase();
        if (!v) return true;

        const blocked = [
            "name", "aug", "sep", "oct", "nov", "dec", "jan", "feb", "mar",
            "apr", "may", "jun", "jul", "present/absent", "present absent",
            "enter-exit", "enter exit", "employee", "employee name",
            "emp name", "date", "day", "sheet", "sheet name"
        ];
        return blocked.includes(v);
    }

    /* 
     * ========================================================
     * FORMAT 1 PARSER: (Emp Code / Emp Name / In-Out Row Blocks)
     * ========================================================
     */
    function parseFormat1Worksheet(rows, sheetName, employeeCounter) {
        const employees = [];
        let currentDayCols = {};

        for (let r = 0; r < rows.length; r++) {
            const row = rows[r] || [];
            if (!row.length) continue;

            const tempDayCols = {};
            for (let c = 1; c < row.length; c++) {
                const cellVal = clean(row[c]);
                const match = cellVal.match(/^(\d{1,2})(?:\s+[A-Za-z]+|[/-][A-Za-z0-9]+)?$/);
                if (match) {
                    const d = parseInt(match[1], 10);
                    if (d >= 1 && d <= 31) {
                        tempDayCols[c] = String(d).padStart(2, "0");
                    }
                }
            }

            if (Object.keys(tempDayCols).length >= 3) {
                currentDayCols = tempDayCols;
                continue;
            }

            const firstCell = clean(row[0]);
            if (/emp\s*code\s*:/i.test(firstCell) || /emp\s*name\s*:/i.test(firstCell)) {
                const codeMatch = firstCell.match(/emp\s*code\s*:\s*([^,\n\r]*)/i);
                const nameMatch = firstCell.match(/emp\s*name\s*:\s*([^,\n\r]*)/i);

                const empCode = codeMatch ? clean(codeMatch[1]) : "";
                const empName = nameMatch ? normalizeName(nameMatch[1]) : "";

                if (!empName) continue;

                let inRow = null;
                let outRow = null;

                for (let offset = 1; offset <= 5; offset++) {
                    if (r + offset >= rows.length) break;
                    const checkRow = rows[r + offset] || [];
                    const label = clean(checkRow[0]).toLowerCase();

                    if (label.includes("in time")) {
                        inRow = checkRow;
                    } else if (label.includes("out time")) {
                        outRow = checkRow;
                    } else if (/emp\s*code\s*:/i.test(label) || /emp\s*name\s*:/i.test(label)) {
                        break;
                    }
                }

                const days = {};
                let totalLate = 0;

                Object.keys(currentDayCols).forEach(colIdx => {
                    const dayStr = currentDayCols[colIdx];
                    let inTime = inRow && colIdx < inRow.length ? clean(inRow[colIdx]) : "";
                    let outTime = outRow && colIdx < outRow.length ? clean(outRow[colIdx]) : "";

                    if (!inTime || inTime === "-") inTime = "--";
                    if (!outTime || outTime === "-") outTime = "--";

                    const hrs = (inTime !== "--" && outTime !== "--")
                        ? calculateWorkingHours(inTime, outTime)
                        : "00:00";

                    days[dayStr] = {
                        in: inTime,
                        out: outTime,
                        hrs: hrs
                    };

                    const inMinutes = timeToMinutes(inTime);
                    if (inMinutes !== null && inMinutes > 9 * 60) {
                        totalLate++;
                    }
                });

                employees.push({
                    sheetName: sheetName,
                    id: empCode || "EMP-" + String(employeeCounter + employees.length + 1).padStart(3, "0"),
                    name: empName,
                    totalLate: totalLate,
                    days: days
                });
            }
        }

        return employees;
    }

    /* 
     * ========================================================
     * FORMAT 2 PARSER: (Horizontal Names + Vertical Days 1-31)
     * ========================================================
     */
    function findNameRow(rows) {
        for (let r = 0; r < Math.min(rows.length, 25); r++) {
            const row = rows[r] || [];
            for (let c = 0; c < row.length; c++) {
                if (clean(row[c]).toLowerCase() === "name") {
                    return r;
                }
            }
        }
        return -1;
    }

    function findFirstDayRow(rows, nameRow) {
        for (let r = nameRow + 1; r < rows.length; r++) {
            const firstCell = clean((rows[r] || [])[0]);
            if (isDay(firstCell)) return r;
            const row = rows[r] || [];
            if (row.some(v => isDay(v))) return r;
        }
        return -1;
    }

    function detectEmployeesFormat2(rows, nameRow, firstDayRow, employeeCounter, sheetName) {
        const header = rows[nameRow] || [];
        const result = [];
        const nameIndex = header.findIndex(v => clean(v).toLowerCase() === "name");
        const startColumn = nameIndex >= 0 ? nameIndex + 1 : 0;

        for (let c = startColumn; c < header.length; c++) {
            const employeeName = normalizeName(header[c]);
            if (!employeeName || isBlockedHeader(employeeName)) continue;

            let hasData = false;
            for (let r = firstDayRow; r < rows.length; r++) {
                const row = rows[r] || [];
                if (!isDay(row[0])) continue;
                const val = clean(row[c]);
                if (val && val !== "-") {
                    hasData = true;
                    break;
                }
            }

            if (hasData) {
                result.push({
                    colIdx: c,
                    sheetName: sheetName,
                    name: employeeName,
                    id: "EMP-" + String(employeeCounter + result.length + 1).padStart(3, "0"),
                    totalLate: 0,
                    days: {}
                });
            }
        }
        return result;
    }

    function parseFormat2Worksheet(rows, sheetName, employeeCounter) {
        const nameRow = findNameRow(rows);
        if (nameRow < 0) return [];

        const firstDayRow = findFirstDayRow(rows, nameRow);
        if (firstDayRow < 0) return [];

        const employees = detectEmployeesFormat2(rows, nameRow, firstDayRow, employeeCounter, sheetName);
        if (!employees.length) return [];

        for (let r = firstDayRow; r < rows.length; r++) {
            const row = rows[r] || [];
            if (!isDay(row[0])) continue;

            const day = dayNumber(row[0]);
            if (day < 1 || day > 31) continue;
            const dayStr = String(day).padStart(2, "0");

            employees.forEach(emp => {
                const punchValue = clean(row[emp.colIdx]);
                const punch = parsePunch(punchValue);
                emp.days[dayStr] = punch;

                const inMinutes = timeToMinutes(punch.in);
                if (inMinutes !== null && inMinutes > 9 * 60) {
                    emp.totalLate++;
                }
            });
        }

        return employees;
    }

    function parseWorksheet(sheet, sheetName, employeeCounter) {
        const rows = XLSX.utils.sheet_to_json(sheet, {
            header: 1,
            defval: "",
            raw: false
        });

        if (!rows || rows.length < 2) {
            return { employees: [], sheetName: sheetName };
        }

        let emps = parseFormat1Worksheet(rows, sheetName, employeeCounter);

        if (!emps || emps.length === 0) {
            emps = parseFormat2Worksheet(rows, sheetName, employeeCounter);
        }

        return {
            employees: emps || [],
            sheetName: sheetName
        };
    }

    async function readExcelFile(file) {
        if (typeof XLSX === "undefined") {
            throw new Error("Excel library failed to load. Please check your network connection.");
        }

        const buffer = await file.arrayBuffer();
        const workbook = XLSX.read(buffer, {
            type: "array",
            cellDates: false,
            cellNF: false,
            cellText: true
        });

        let employees = [];
        let employeeCounter = 0;
        let usedSheets = [];

        workbook.SheetNames.forEach(sheetName => {
            const sheet = workbook.Sheets[sheetName];
            try {
                const result = parseWorksheet(sheet, sheetName, employeeCounter);
                if (result.employees.length > 0) {
                    employeeCounter += result.employees.length;
                    employees = employees.concat(result.employees);
                    usedSheets.push(sheetName);
                }
            } catch (error) {
                console.warn("Could not parse sheet:", sheetName, error);
            }
        });

        const unique = [];
        const seen = new Set();

        employees.forEach(emp => {
            const key = (emp.sheetName + "_" + emp.name).toLowerCase().replace(/\s+/g, " ").trim();
            if (!seen.has(key)) {
                seen.add(key);
                unique.push(emp);
            }
        });

        return {
            employees: unique,
            sheets: workbook.SheetNames,
            usedSheets: usedSheets
        };
    }

    function getPeriodText() {
        const now = new Date();
        const monthNames = [
            "Jan","Feb","Mar","Apr","May","Jun",
            "Jul","Aug","Sep","Oct","Nov","Dec"
        ];
        const first = "01-" + monthNames[now.getMonth()] + "-" + now.getFullYear();
        const last = String(now.getDate()).padStart(2, "0") +
            "-" + monthNames[now.getMonth()] +
            "-" + now.getFullYear();

        return "Details For " + first + " to " + last;
    }

    function generateExcel(employees) {
        const companyName = "RD Public School, Betul";
        const data = [
            [companyName.toUpperCase()],
            ["BIOMETRIC ATTENDANCE MATRIX REPORT"],
            [getPeriodText()],
            [""]
        ];

        // Column 1: Emp Name, Column 2: Shift Name, Column 3: Emp ID, Column 4: Total Late
        const header = ["Emp Name", "Shift Name", "Emp ID", "Total Late"];
        for (let d = 1; d <= 31; d++) {
            header.push("Day " + d);
        }
        data.push(header);

        employees.forEach(emp => {
            const row = [
                emp.name,
                emp.sheetName || "",
                emp.id,
                emp.totalLate
            ];

            for (let d = 1; d <= 31; d++) {
                const day = String(d).padStart(2, "0");
                const info = emp.days[day];

                if (info && info.in && info.in !== "--") {
                    row.push(
                        "In: " + info.in +
                        "\nOut: " + info.out +
                        "\nHrs: " + info.hrs
                    );
                } else {
                    row.push("-");
                }
            }
            data.push(row);
        });

        const ws = XLSX.utils.aoa_to_sheet(data);
        ws["!cols"] = [
            { wch: 28 }, // Emp Name
            { wch: 22 }, // Sheet Name
            { wch: 12 }, // Emp ID
            { wch: 12 }  // Total Late
        ];
        for (let i = 0; i < 31; i++) {
            ws["!cols"].push({ wch: 18 });
        }

        const range = XLSX.utils.decode_range(ws["!ref"]);
        for (let c = range.s.c; c <= range.e.c; c++) {
            const cellAddress = XLSX.utils.encode_cell({ r: 4, c: c });
            if (ws[cellAddress]) {
                ws[cellAddress].s = {
                    font: { bold: true, color: { rgb: "FFFFFF" } },
                    fill: { fgColor: { rgb: "1E293B" } },
                    alignment: { horizontal: "center", vertical: "center", wrapText: true },
                    border: {
                        top: { style: "thin", color: { rgb: "CBD5E1" } },
                        bottom: { style: "thin", color: { rgb: "CBD5E1" } },
                        left: { style: "thin", color: { rgb: "CBD5E1" } },
                        right: { style: "thin", color: { rgb: "CBD5E1" } }
                    }
                };
            }
        }

        for (let r = 5; r <= range.e.r; r++) {
            for (let c = 0; c <= range.e.c; c++) {
                const addr = XLSX.utils.encode_cell({ r: r, c: c });
                if (!ws[addr]) continue;
                ws[addr].s = {
                    alignment: {
                        horizontal: (c === 0 || c === 1) ? "left" : "center",
                        vertical: "center",
                        wrapText: true
                    },
                    border: {
                        top: { style: "thin", color: { rgb: "CBD5E1" } },
                        bottom: { style: "thin", color: { rgb: "CBD5E1" } },
                        left: { style: "thin", color: { rgb: "CBD5E1" } },
                        right: { style: "thin", color: { rgb: "CBD5E1" } }
                    }
                };
            }
        }

        // Freeze columns up to Column D (first 4 columns) and top header rows
        ws["!freeze"] = { xSplit: 4, ySplit: 5 };
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, "Custom Matrix");
        XLSX.writeFile(wb, "Custom_Matrix_Attendance.xlsx");
    }

    function generatePDF(employees) {
        if (typeof window.jspdf === "undefined" || !window.jspdf.jsPDF) {
            throw new Error("PDF library failed to load.");
        }

        const jsPDF = window.jspdf.jsPDF;
        const doc = new jsPDF({
            orientation: "landscape",
            unit: "mm",
            format: "a4"
        });

        employees.forEach((emp, index) => {
            if (index > 0) doc.addPage();

            doc.setFont("helvetica", "bold");
            doc.setFontSize(11);
            doc.text("RD Public School, Betul", 10, 10);

            doc.setFont("helvetica", "normal");
            doc.setFontSize(8);
            doc.text(getPeriodText(), 10, 15);

            doc.setFont("helvetica", "bold");
            doc.text(
                "Emp Name: " + emp.name +
                " | Sheet: " + (emp.sheetName || "N/A") +
                " | Emp ID: " + emp.id +
                " | Total Late: " + emp.totalLate,
                10,
                21
            );

            const headers = ["Emp Name", "Sheet Name", "Emp ID", "Total Late"];
            for (let d = 1; d <= 31; d++) {
                headers.push("Day " + d);
            }

            const body = [[
                emp.name,
                emp.sheetName || "",
                emp.id,
                String(emp.totalLate)
            ]];

            for (let d = 1; d <= 31; d++) {
                const day = String(d).padStart(2, "0");
                const info = emp.days[day];

                if (info && info.in && info.in !== "--") {
                    body[0].push(
                        "In: " + info.in +
                        "\nOut: " + info.out +
                        "\nHrs: " + info.hrs
                    );
                } else {
                    body[0].push("-");
                }
            }

            doc.autoTable({
                startY: 25,
                margin: { left: 7, right: 7 },
                head: [headers],
                body: body,
                theme: "grid",
                styles: {
                    font: "helvetica",
                    fontSize: 5,
                    cellPadding: 1,
                    halign: "center",
                    valign: "middle",
                    lineWidth: 0.1
                },
                headStyles: {
                    fontStyle: "bold",
                    halign: "center"
                },
                columnStyles: {
                    0: { cellWidth: 22, halign: "left" },
                    1: { cellWidth: 18, halign: "left" },
                    2: { cellWidth: 12 },
                    3: { cellWidth: 10 }
                }
            });
        });

        doc.save("Custom_Matrix_Attendance_Report.pdf");
    }

    window.processAndDownload = async function (outputFormat) {
        try {
            if (!fileInput.files || fileInput.files.length === 0) {
                alert("Please select an attendance Excel file first.");
                return;
            }

            const file = fileInput.files[0];
            showStatus("Reading workbook and parsing all sheets...", "info");

            const result = await readExcelFile(file);

            if (!result.employees.length) {
                showStatus(
                    "No employee attendance data was detected. Please ensure the file contains valid attendance matrix columns or employee log rows.",
                    "error"
                );
                return;
            }

            showStatus(
                "Found " + result.employees.length +
                " employee(s) in " + result.usedSheets.length +
                " sheet(s): " + result.usedSheets.join(", "),
                "success"
            );

            if (outputFormat === "excel") {
                generateExcel(result.employees);
            } else if (outputFormat === "pdf") {
                generatePDF(result.employees);
            } else {
                throw new Error("Unknown output format: " + outputFormat);
            }

        } catch (error) {
            console.error("Attendance generation error:", error);
            showStatus("Error: " + (error.message || String(error)), "error");
            alert("Unable to generate the report.\n\n" + (error.message || String(error)));
        }
    };

    window.generateAttendanceExcel = function () {
        return window.processAndDownload("excel");
    };

    window.generateAttendancePDF = function () {
        return window.processAndDownload("pdf");
    };

    document.getElementById("excelBtn").addEventListener("click", function () {
        window.processAndDownload("excel");
    });

    document.getElementById("pdfBtn").addEventListener("click", function () {
        window.processAndDownload("pdf");
    });

})();
</script>
</body>
</html>
